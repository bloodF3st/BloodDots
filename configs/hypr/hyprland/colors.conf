general {
    col.active_border = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.inactive_border = rgba(b4befecc) rgba(6c7086cc) 45deg
}

misc {
    background_color = rgba(1e1e2eFF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(1e1e2eCC)
        col.text = rgba(cdd6f4FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e5e1e9), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e5e1e9), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(e5e1e9), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(c3c0ffAA) rgba(c3c0ff77), match:pin 1

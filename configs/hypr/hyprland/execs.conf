# Bar, wallpaper
exec-once = ~/.config/hypr/hyprland/scripts/start_geoclue_agent.sh
exec-once = qs -c $qsConfig &
# exec-once = sleep 2 && ~/.config/hypr/custom/scripts/__restore_video_wallpaper.sh

# Core components (authentication, lock screen, notification daemon)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Some fix idk

# Audio
exec-once = easyeffects --hide-window --service-mode

# Clipboard: history + persistence
# wl-clip-persist и cliphist управляются через systemd user services (см. ~/.config/systemd/user/)
# Автостарт при логине происходит автоматически через graphical-session.target
# Изображения НЕ хранятся в cliphist (лаг 5+ сек на больших фото) — wl-clip-persist держит их

# Cursor
exec-once = hyprctl setcursor Kitty 24

# Fix dock pinned apps not launching properly (https://github.com/end-4/dots-hyprland/issues/2200)
# This causes https://github.com/end-4/dots-hyprland/issues/2427
# exec-once = sleep 3.5 && hyprctl reload && sleep 0.5 && touch ~/.config/quickshell/ii/shell.qml
exec-once = ~/.config/hypr/custom/scripts/fix_ayugram_dialog.sh
